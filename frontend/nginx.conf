server {
    listen       80;
    server_name  _;

    # ── Static SPA assets ────────────────────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    # All non-file, non-API routes fall back to index.html (React router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API reverse-proxy to Spring Boot backend ─────────────────────
    # "backend" is the docker-compose service name resolved via Docker DNS
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Swagger UI ───────────────────────────────────────────────────
    location /swagger-ui/ {
        proxy_pass         http://backend:8080/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location = /swagger-ui.html {
        proxy_pass         http://backend:8080/swagger-ui.html;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    location /api-docs {
        proxy_pass         http://backend:8080/api-docs;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── Static asset caching ─────────────────────────────────────────
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ── Simple health check ──────────────────────────────────────────
    location = /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
