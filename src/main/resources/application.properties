# =============================================
# KEYSTONE - Application Configuration
# =============================================

spring.application.name=keystone-backend

# -----------------------------------------------
# DATABASE
# -----------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/keystone}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Yash@123}
spring.datasource.driver-class-name=org.postgresql.Driver

# -----------------------------------------------
# JPA
# -----------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------
# FLYWAY
# -----------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# -----------------------------------------------
# JWT
# -----------------------------------------------
jwt.secret=${JWT_SECRET:VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUX0tleXN0b25lQXBwMjAyNg==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# -----------------------------------------------
# SCHEDULING
# -----------------------------------------------
spring.task.scheduling.pool.size=2

# -----------------------------------------------
# LOGGING
# -----------------------------------------------
logging.level.org.springframework.security=WARN
logging.level.com.keystone=INFO
logging.level.org.flywaydb=INFO

# -----------------------------------------------
# SWAGGER
# -----------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# -----------------------------------------------
# SERVER
# -----------------------------------------------
server.port=${PORT:8080}