# =============================================
# TEST CONFIGURATION - H2 in-memory database
# =============================================

spring.datasource.url=jdbc:h2:mem:keystonetest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create schema from entities for tests (Flyway disabled)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

jwt.secret=VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUX0tleXN0b25lQXBwMjAyNg==
jwt.expiration=86400000

logging.level.org.springframework.security=WARN
logging.level.com.keystone=DEBUG

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
